<script>
// ═══════════════════════════════════════════════════════════════════
//  CONTENT — edit everything here, never touch anything below
// ═══════════════════════════════════════════════════════════════════
const CONTENT = {

  // ── Hero ──────────────────────────────────────────────────────────
  heroTag:   "Calculus → Artificial Intelligence",
  heroTitle: "What does a humble function gradient have to do with AI? A lot",
  heroSub:   "You've been computing it all semester. Here's why it matters.",

  // ── Act I ─────────────────────────────────────────────────────────
  act1Label:   "Act I",
  act1Heading: "The magic of gradient descent",
  act1P1: `You've computed the derivative of <span class="math">f(x) = x²</span>, found where it's zero,
    and concluded that's a minimum. Simple. But let's do it a little differently, using the <em>gradient descent</em>.`,
  act1P2: `The derivative <span class="math">f′(x)</span> at any point is the
    <strong style="color:var(--chalk)">slope of the curve</strong> at that point.
    If <span class="math">f′(x) &gt; 0</span>, the function is climbing to the right.
    If <span class="math">f′(x) &lt; 0</span>, it's falling.
    To find the minimum: move <em>opposite</em> to the slope.`,
  act1CanvasTitle: "f(x) = x² + 0.3x — derivative & descent",
  act1LrLabel: `step size α <input type="range" id="lr1" min="0.05" max="0.5" step="0.01" value="0.18">`,
  act1Mathblock: `x<sub>new</sub> = x<sub>old</sub> − α · f′(x<sub>old</sub>)<br>
    <span class="comment">// gradient positive: step left; gradient negative: step right (scaled by learning rate α)</span>`,
  act1InsightLabel: "Key insight",
    act1InsightText: `To find a minimum of f(x), do not solve f′(x) = 0 algebraically. Just <em>follow the slope downhill,</em>
    one small step at a time, until we stopped moving. That's gradient descent.`,

  // ── Act II ────────────────────────────────────────────────────────
  act2Label:   "Act II",
  act2Heading: "Meet <em>L(θ)</em> — the function that LLMs minimize",
  act2P1: `Every LLM — GPT, Claude, Gemini — is trained by minimizing a function using gradient descent.
    That function is called the <strong style="color:var(--chalk)">loss function</strong>,
    written <span class="math">L(θ)</span>.`,
  act2P2: `It is the direct equivalent of <span class="math">f(x)</span> in your calculus homework.
    Here are the differences:`,
  // Comparison table rows: [concept, your-calculus, llm-training]
  compareTableRows: [
    ["The function",    `<span class="mono">f(x)</span>`,           `<span class="mono">L(θ)</span>`],
    ["The input(s)",    `<span class="hl">x</span> — one number`,    `<span class="hl">θ</span> — ~100 billion numbers (the model's weights)`],
    ["The output",      `a single number — the function's value`,    `a single number — <span style="color:var(--accent3)">how wrong the model is</span>`],
    ["The goal",        `find the minimum of f`,                     `find θ that minimizes L (= makes the model least wrong)`],
    ["How we get there",`<span class="mono">x ← x − α·f′(x)</span>`,`<span class="mono">θ ← θ − α·∇L(θ)</span>`],
  ],
  act2P3: `The symbol <span class="math">∇L(θ)</span> (del L) is the
    <strong style="color:var(--chalk)">gradient</strong> —
    the multi-variable generalization of <span class="math">f′(x)</span>. Instead of one slope, it's a vector
    of ~100 billion partial derivatives, one for each weight. Same concept, ridiculous scale.`,
  act2Mathblock: `∇L(θ) = [ ∂L/∂θ₁, ∂L/∂θ₂, … , ∂L/∂θₙ ]<br>
    <span class="comment">// n ≈ 100,000,000,000 for a large model</span><br>
    <span class="comment">// each ∂L/∂θᵢ is exactly the same kind of derivative you already compute</span>`,

  // ── Act III ───────────────────────────────────────────────────────
  act3Label:   "Act III",
  act3Heading: "What does <em>L(θ)</em> actually measure?",
  act3P1: `So what <em>is</em> the loss function, concretely? For language models, it measures one thing:
    <strong style="color:var(--chalk)">the probability of the next word</strong>`,

  // Token demo — change these to any sequence you like
  act3Callout: `The model doesn't output just one number. It outputs a
    <strong style="color:var(--chalk)">probability for every word in its vocabulary</strong> — around 50,000 words.
    That's a lot of outputs. The loss function ignores 49,999 of them. It only asks one question:
    <em>what probability did the model assign to the correct word?</em>
    That single number — call it P — goes into L&nbsp;=&nbsp;−log(P).
    Everything else is discarded from the loss calculation. We use log because the probabilities are small; and we use minus because  
    the gradient descent finds minimum, not maximum`,
  tokenContextLabel:  "INPUT CONTEXT",
  tokenPredictLabel:  "MODEL MUST PREDICT THE NEXT WORD",
  tokenProbLabel:     "P(correct word):",
  tokenContext:    ["The", "cat", "sat", "on", "the"],
  tokenCandidates: ["mat", "dog", "quickly", "blue", "ran"],
  tokenCorrect:    "mat",

  act3CanvasTitle: "L = −log(P) — loss as a function of model confidence",
  act3ProbLabel: `P(correct word): <input type="range" id="prob-slider" min="0.01" max="0.999" step="0.01" value="0.5">`,
  act3Mathblock: `L = − log P(correct next word)<br><br>
    P = 0.01 &nbsp;→ L = −log(0.01) = <span style="color:var(--accent3)">4.61 &nbsp;← model knows nothing</span><br>
    P = 0.50 &nbsp;→ L = −log(0.50) = <span style="color:var(--accent)">0.69 &nbsp;← uncertain</span><br>
    P = 0.99 &nbsp;→ L = −log(0.99) = <span style="color:var(--green)">0.01 &nbsp;← almost perfect</span>`,
  act3P2: `Over a training dataset of billions of tokens, we <em>average</em> this across all positions.
    That average is what training tries to minimize. Every gradient descent step nudges
    the model's 100B weights in the direction that makes the model make slightly fewer next-word errors.
    Do that enough times, and you get LLM.`,
  act3FormulaHeading: "Cross-entropy loss — the full formula",
  act3FormulaBlock: `L(θ) = − (1/N) · Σᵢ log P_θ(word_{i+1} | word₁…wordᵢ)<br>
    <span class="comment">// average surprise over words in the training set</span><br>
    <span class="comment">// P_θ means "probability assigned by model with weights θ"</span>`,

  // ── Act IV ────────────────────────────────────────────────────────
  act4Label:   "Act IV",

// ─────────────────────────────────────────────────────────────────
// UTILITIES
// ─────────────────────────────────────────────────────────────────
function dpr(canvas) {
  const r = window.devicePixelRatio || 1;
  const rect = canvas.getBoundingClientRect();
  canvas.width = rect.width * r; canvas.height = rect.height * r;
  const ctx = canvas.getContext('2d'); ctx.scale(r, r); return ctx;
}
function W(canvas) { return canvas.getBoundingClientRect().width; }
function H(canvas) { return canvas.getBoundingClientRect().height; }
const COLORS = {
  bg2:'#13161e',bg3:'#1a1e28',surface:'#1e2330',border:'#2a2f3f',
  text:'#e8e4d9',muted:'#7a8099',accent:'#f5a623',accent2:'#4ecdc4',
  accent3:'#ff6b6b',green:'#6bcb77',chalk:'#f0ead6'
};
function lerp(a,b,t) { return a+(b-a)*t; }

// ─────────────────────────────────────────────────────────────────
// CANVAS 1 — 1D gradient descent
// ─────────────────────────────────────────────────────────────────
(function() {
  const canvas = document.getElementById('c1');
  const btn = document.getElementById('btn-run1');
  const btnStep = document.getElementById('btn-step1');
  const btnR = document.getElementById('btn-reset1');
  const stat = document.getElementById('stat1');
  const derivOut = document.getElementById('deriv-readout');

  const f = x => x*x + 0.3*x;
  const df = x => 2*x + 0.3;
  let xPos = 2.2, running = false, animId = null;
  const xMin=-2.5, xMax=2.5, yMin=-0.1, yMax=6.5;

  function toCanvas(wx, wy) {
    const cw=W(canvas), ch=H(canvas);
    return [ ((wx-xMin)/(xMax-xMin))*cw, ch - ((wy-yMin)/(yMax-yMin))*ch ];
  }

  function draw() {
    const ctx = dpr(canvas);
    const cw=W(canvas), ch=H(canvas);
    ctx.clearRect(0,0,cw,ch);

    // x-axis
    ctx.strokeStyle=COLORS.border; ctx.lineWidth=1;
    const [ax0,ay0]=toCanvas(xMin,0), [ax1]=toCanvas(xMax,0);
    ctx.beginPath(); ctx.moveTo(ax0,ay0); ctx.lineTo(ax1,ay0); ctx.stroke();

    // curve
    ctx.strokeStyle=COLORS.accent2; ctx.lineWidth=2.5; ctx.beginPath();
    for (let i=0; i<=200; i++) {
      const wx=xMin+(xMax-xMin)*i/200, [cx,cy]=toCanvas(wx,f(wx));
      i===0 ? ctx.moveTo(cx,cy) : ctx.lineTo(cx,cy);
    }
    ctx.stroke();

    // tangent line at xPos — purple dotted
    const slope2 = df(xPos);
    const tw = 0.9;
    const [t0x,t0y] = toCanvas(xPos - tw, f(xPos) + slope2 * (-tw));
    const [t1x,t1y] = toCanvas(xPos + tw, f(xPos) + slope2 * tw);
    ctx.strokeStyle = '#c084fc'; ctx.lineWidth = 1.8; ctx.setLineDash([6,4]);
    ctx.beginPath(); ctx.moveTo(t0x,t0y); ctx.lineTo(t1x,t1y); ctx.stroke();
    ctx.setLineDash([]);

    // arrow: current x → next x on the same horizontal
    const slope = df(xPos);
    const lrEl = document.getElementById('lr1');
    const lr = lrEl ? parseFloat(lrEl.value) : 0.18;
    const xNext = xPos - lr * slope;
    const [bx,by] = toCanvas(xPos, f(xPos));
    const [ex,ey] = toCanvas(xNext, f(xPos));
    ctx.strokeStyle=COLORS.accent; ctx.lineWidth=2.5;
    ctx.beginPath(); ctx.moveTo(bx,by); ctx.lineTo(ex,ey); ctx.stroke();
    const angle=Math.atan2(ey-by, ex-bx), hs=10;
    ctx.fillStyle=COLORS.accent; ctx.beginPath();
    ctx.moveTo(ex,ey);
    ctx.lineTo(ex-hs*Math.cos(angle-0.38), ey-hs*Math.sin(angle-0.38));
    ctx.lineTo(ex-hs*Math.cos(angle+0.38), ey-hs*Math.sin(angle+0.38));
    ctx.closePath(); ctx.fill();
    // dashed drop to curve
    const [nx,ny]=toCanvas(xNext, f(xNext));
    ctx.strokeStyle='rgba(245,166,35,0.3)'; ctx.lineWidth=1; ctx.setLineDash([3,4]);
    ctx.beginPath(); ctx.moveTo(ex,ey); ctx.lineTo(nx,ny); ctx.stroke();
    ctx.setLineDash([]);

    // ball
    const [px,py]=toCanvas(xPos,f(xPos));
    ctx.fillStyle=COLORS.accent; ctx.shadowColor=COLORS.accent; ctx.shadowBlur=14;
    ctx.beginPath(); ctx.arc(px,py,7,0,Math.PI*2); ctx.fill(); ctx.shadowBlur=0;

    // minimum marker
    const xmin=-0.15, [mx,my]=toCanvas(xmin,f(xmin));
    ctx.strokeStyle=COLORS.green; ctx.lineWidth=1; ctx.setLineDash([3,3]);
    ctx.beginPath(); ctx.moveTo(mx,0); ctx.lineTo(mx,my); ctx.stroke(); ctx.setLineDash([]);
    ctx.fillStyle=COLORS.green; ctx.font='11px JetBrains Mono';
    ctx.fillText('minimum', mx+4, my-10);

    stat.textContent = `x = ${xPos.toFixed(3)},  f(x) = ${f(xPos).toFixed(3)}`;
    derivOut.textContent = `f′(x) = ${slope.toFixed(3)}`;
  }

  function doOneStep() {
    const lrEl = document.getElementById('lr1');
    const lr = lrEl ? parseFloat(lrEl.value) : 0.18;
    const grad = df(xPos);
    xPos -= lr * grad;
    xPos = Math.max(xMin+0.1, Math.min(xMax-0.1, xPos));
    draw();
    return Math.abs(grad);
  }

  function step() {
    const gradMag = doOneStep();
    if (gradMag < 0.003 || !running) { running=false; btn.textContent='▶ Run'; return; }
    animId = setTimeout(step, 220);
  }

  btn.addEventListener('click', () => {
    if (running) { running=false; clearTimeout(animId); btn.textContent='▶ Run'; }
    else { running=true; btn.textContent='⏸ Pause'; step(); }
  });
  btnStep.addEventListener('click', () => {
    running=false; clearTimeout(animId); btn.textContent='▶ Run'; doOneStep();
  });
  btnR.addEventListener('click', () => {
    running=false; clearTimeout(animId); btn.textContent='▶ Run'; xPos=2.2; draw();
  });

  window.addEventListener('resize', draw);
  draw();
})();

// ─────────────────────────────────────────────────────────────────
// CANVAS VOCAB — probability distribution over ~50k words
// ─────────────────────────────────────────────────────────────────
(function(){
  const canvas = document.getElementById('c-vocab');
  if (!canvas) return;

  // Representative words: most get tiny prob, a few get medium, correct gets highlighted
  const words = [
    {w:'the',   p:0.002}, {w:'a',     p:0.003}, {w:'is',    p:0.001},
    {w:'in',    p:0.004}, {w:'was',   p:0.008}, {w:'on',    p:0.012},
    {w:'dog',   p:0.018}, {w:'floor', p:0.031}, {w:'roof',  p:0.024},
    {w:'ran',   p:0.041}, {w:'blue',  p:0.019}, {w:'mat',   p:0.61, correct:true},
    {w:'chair', p:0.028}, {w:'table', p:0.022}, {w:'...',   p:0.001},
  ];
  // Add ghost bars representing the remaining ~49,985 words
  const GHOST_GROUPS = 6;

  function draw() {
    const ctx = dpr(canvas);
    const cw = W(canvas), ch = H(canvas);
    ctx.clearRect(0,0,cw,ch);

    const PAD = {top:24, right:20, bottom:52, left:16};
    const pw = cw - PAD.left - PAD.right;
    const ph = ch - PAD.top  - PAD.bottom;

    const allBars = words.length + GHOST_GROUPS;
    const barW = Math.floor(pw / allBars * 0.72);
    const gap  = pw / allBars;

    const pMax = 0.65;
    const toY  = p => PAD.top + (1 - p/pMax)*ph;

    // Title hint
    ctx.fillStyle = COLORS.muted; ctx.font='10px JetBrains Mono'; ctx.textAlign='left';
    ctx.fillText('P(word)', 4, PAD.top - 8);

    // Y axis tick
    ctx.strokeStyle = COLORS.border; ctx.lineWidth=1;
    ctx.beginPath(); ctx.moveTo(PAD.left, PAD.top); ctx.lineTo(PAD.left, PAD.top+ph); ctx.stroke();

    // Draw named word bars
    words.forEach((d, i) => {
      const x = PAD.left + i * gap + (gap - barW)/2;
      const barH = Math.max(2, (d.p / pMax) * ph);
      const y = PAD.top + ph - barH;

      if (d.correct) {
        // Green glowing bar
        ctx.fillStyle = COLORS.green;
        ctx.shadowColor = COLORS.green; ctx.shadowBlur = 10;
        ctx.fillRect(x, y, barW, barH);
        ctx.shadowBlur = 0;

        // Arrow from top of bar rightward to L formula
        const arrowStartX = x + barW/2;
        const arrowStartY = y - 8;
        const arrowEndX   = cw - PAD.right - 4;
        const arrowEndY   = arrowStartY;
        ctx.strokeStyle = COLORS.accent; ctx.lineWidth = 1.8;
        ctx.setLineDash([4,3]);
        ctx.beginPath(); ctx.moveTo(arrowStartX, arrowStartY); ctx.lineTo(arrowEndX - 8, arrowEndY); ctx.stroke();
        ctx.setLineDash([]);
        // Arrowhead
        ctx.fillStyle = COLORS.accent;
        ctx.beginPath();
        ctx.moveTo(arrowEndX, arrowEndY);
        ctx.lineTo(arrowEndX-8, arrowEndY-4);
        ctx.lineTo(arrowEndX-8, arrowEndY+4);
        ctx.closePath(); ctx.fill();
        // L = -log(P) label at arrow tip
        ctx.fillStyle = COLORS.accent; ctx.font='bold 10px JetBrains Mono'; ctx.textAlign='right';
        ctx.fillText('L = −log(P)', arrowEndX - 10, arrowEndY - 8);
        ctx.textAlign='left';

        // Word label — green, bold
        ctx.fillStyle = COLORS.green; ctx.font='bold 10px JetBrains Mono'; ctx.textAlign='center';
        ctx.fillText(d.w, x + barW/2, PAD.top + ph + 14);
        // P value
        ctx.fillStyle = COLORS.green; ctx.font='9px JetBrains Mono';
        ctx.fillText(d.p.toFixed(2), x + barW/2, PAD.top + ph + 26);
        ctx.textAlign='left';
        // "← correct word" label
        ctx.fillStyle = 'rgba(107,203,119,0.75)'; ctx.font='9px JetBrains Mono';
        ctx.textAlign='center';
        ctx.fillText('← correct', x + barW/2, PAD.top + ph + 38);
        ctx.textAlign='left';
      } else {
        // Dim blue-grey bars
        ctx.fillStyle = 'rgba(78,140,196,0.28)';
        ctx.fillRect(x, y, barW, barH);
        // Word label
        ctx.fillStyle = COLORS.muted; ctx.font='9px JetBrains Mono'; ctx.textAlign='center';
        ctx.fillText(d.w, x + barW/2, PAD.top + ph + 14);
        ctx.textAlign='left';
      }
    });

    // Ghost bars (representing the rest of the ~50k vocabulary)
    for (let g=0; g<GHOST_GROUPS; g++) {
      const i = words.length + g;
      const x = PAD.left + i * gap + (gap - barW)/2;
      const p = 0.001 + Math.random()*0.004; // tiny
      const barH = Math.max(2, (p/pMax)*ph);
      const y = PAD.top + ph - barH;
      ctx.fillStyle = 'rgba(78,100,140,0.15)';
      ctx.fillRect(x, y, barW, barH);
    }
    // "~49,985 more words" label under ghost group
    const gx = PAD.left + words.length * gap;
    ctx.fillStyle = COLORS.muted; ctx.font='8px JetBrains Mono'; ctx.textAlign='center';
    ctx.fillText('~49,985', gx + GHOST_GROUPS*gap/2, PAD.top+ph+14);
    ctx.fillText('more words', gx + GHOST_GROUPS*gap/2, PAD.top+ph+24);
    ctx.fillText('(ignored)', gx + GHOST_GROUPS*gap/2, PAD.top+ph+34);
    ctx.textAlign='left';

    // X-axis baseline
    ctx.strokeStyle = COLORS.border; ctx.lineWidth=1;
    ctx.beginPath(); ctx.moveTo(PAD.left, PAD.top+ph); ctx.lineTo(PAD.left+pw, PAD.top+ph); ctx.stroke();
  }

  window.addEventListener('resize', draw);
  draw();
})();

// ─────────────────────────────────────────────────────────────────
// CANVAS 2 — cross-entropy curve
// ─────────────────────────────────────────────────────────────────
(function(){
  const canvas  = document.getElementById('c2');
  const stat    = document.getElementById('stat2');
  const readout = document.getElementById('ce-readout');

  function draw() {
    const slider=document.getElementById('prob-slider'); if(!slider) return;
    const ctx=dpr(canvas), cw=W(canvas), ch=H(canvas);
    ctx.clearRect(0,0,cw,ch);
    const pMin=0.01,pMax=0.999,lMax=5;
    const toX=p=>((p-pMin)/(pMax-pMin))*cw;
    const toY=l=>ch-(l/lMax)*ch;

    ctx.strokeStyle=COLORS.border; ctx.lineWidth=1;
    [1,2,3,4].forEach(l=>{
      ctx.beginPath(); ctx.moveTo(0,toY(l)); ctx.lineTo(cw,toY(l)); ctx.stroke();
      ctx.fillStyle=COLORS.muted; ctx.font='10px JetBrains Mono';
      ctx.fillText('L='+l, 4, toY(l)-3);
    });
    [0.25,0.5,0.75].forEach(p=>{
      ctx.beginPath(); ctx.moveTo(toX(p),0); ctx.lineTo(toX(p),ch); ctx.stroke();
      ctx.fillStyle=COLORS.muted; ctx.font='10px JetBrains Mono';
      ctx.fillText(p, toX(p)+3, ch-4);
    });

    ctx.strokeStyle=COLORS.accent2; ctx.lineWidth=2.5; ctx.beginPath();
    for(let i=0;i<=300;i++){
      const p=pMin+(pMax-pMin)*i/300, l=-Math.log(p);
      if(l>lMax) continue;
      i===0?ctx.moveTo(toX(p),toY(l)):ctx.lineTo(toX(p),toY(l));
    }
    ctx.stroke();

    const p=parseFloat(slider.value), l=-Math.log(p);
    if(l<=lMax){
      ctx.fillStyle=COLORS.accent; ctx.shadowColor=COLORS.accent; ctx.shadowBlur=12;
      ctx.beginPath(); ctx.arc(toX(p),toY(l),7,0,Math.PI*2); ctx.fill(); ctx.shadowBlur=0;
      stat.textContent=`loss = ${l.toFixed(3)}`;
      readout.textContent=`P=${p.toFixed(2)}, −log(P)=${l.toFixed(3)}`;
    }

    ctx.fillStyle=COLORS.muted; ctx.font='10px JetBrains Mono';
    ctx.fillText('← model is wrong', 8, 18);
    ctx.textAlign='right'; ctx.fillText('model is right →', cw-8, ch-8); ctx.textAlign='left';
  }

  setTimeout(()=>{
    const slider=document.getElementById('prob-slider');
    if(slider){ slider.addEventListener('input', draw); draw(); }
    window.addEventListener('resize', draw);
  },0);
})();

// ─────────────────────────────────────────────────────────────────
// CANVAS 3 — training loss curve (loss vs gradient step)
// ─────────────────────────────────────────────────────────────────
(function(){
  const canvas  = document.getElementById('c3');
  const btn     = document.getElementById('btn-run3');
  const btnR    = document.getElementById('btn-reset3');
  const stat    = document.getElementById('stat3');
  const readout = document.getElementById('act4-step-readout');

  // Simulate a realistic training loss curve:
  // fast initial drop, then slower convergence with small noise
  const TOTAL_STEPS = 120;
  function lossAtStep(k) {
    const base = 4.5 * Math.exp(-k / 22) + 0.38 * Math.exp(-k / 90) + 0.12;
    const noise = 0.06 * Math.sin(k * 1.7) * Math.exp(-k / 30)
                + 0.03 * Math.sin(k * 4.3) * Math.exp(-k / 60)
                + 0.015 * (Math.random() - 0.5);
    return base + noise;
  }
  // Pre-generate so noise is fixed across redraws
  let lossHistory = [];
  function generateHistory() {
    lossHistory = [];
    for (let k = 0; k <= TOTAL_STEPS; k++) lossHistory.push(lossAtStep(k));
  }
  generateHistory();

  let revealedSteps = 0;
  let running = false, animId = null;

  const PAD = { top: 28, right: 24, bottom: 36, left: 54 };

  function draw() {
    const ctx = dpr(canvas);
    const cw = W(canvas), ch = H(canvas);
    ctx.clearRect(0, 0, cw, ch);

    const pw = cw - PAD.left - PAD.right;
    const ph = ch - PAD.top  - PAD.bottom;
    const lossMax = 4.8, lossMin = 0;

    function tx(step) { return PAD.left + (step / TOTAL_STEPS) * pw; }
    function ty(l)    { return PAD.top  + (1 - (l - lossMin) / (lossMax - lossMin)) * ph; }

    // Grid
    ctx.strokeStyle = COLORS.border; ctx.lineWidth = 1;
    [0, 1, 2, 3, 4].forEach(l => {
      ctx.beginPath(); ctx.moveTo(PAD.left, ty(l)); ctx.lineTo(PAD.left + pw, ty(l)); ctx.stroke();
      ctx.fillStyle = COLORS.muted; ctx.font = '10px JetBrains Mono'; ctx.textAlign = 'right';
      ctx.fillText(l.toFixed(0), PAD.left - 6, ty(l) + 3);
    });
    ctx.textAlign = 'left';

    // Axis labels
    ctx.fillStyle = COLORS.muted; ctx.font = '10px JetBrains Mono';
    ctx.fillText('Loss L(θ)', 4, PAD.top - 10);
    ctx.textAlign = 'center';
    ctx.fillText('Gradient descent step', PAD.left + pw / 2, ch - 4);
    ctx.textAlign = 'left';

    // Step tick marks
    [0, 30, 60, 90, 120].forEach(s => {
      ctx.fillStyle = COLORS.muted; ctx.font = '10px JetBrains Mono'; ctx.textAlign = 'center';
      ctx.fillText(s, tx(s), ch - PAD.bottom + 14);
    });
    ctx.textAlign = 'left';

    // Axes
    ctx.strokeStyle = COLORS.border; ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(PAD.left, PAD.top); ctx.lineTo(PAD.left, PAD.top + ph);
    ctx.lineTo(PAD.left + pw, PAD.top + ph);
    ctx.stroke();

    if (revealedSteps < 1) return;

    // Shaded area under curve
    ctx.beginPath();
    ctx.moveTo(tx(0), ty(lossHistory[0]));
    for (let k = 1; k <= revealedSteps; k++) ctx.lineTo(tx(k), ty(lossHistory[k]));
    ctx.lineTo(tx(revealedSteps), ty(0) + ph - (ty(0) - PAD.top - ph));
    ctx.lineTo(tx(0), PAD.top + ph);
    ctx.closePath();
    ctx.fillStyle = 'rgba(245,166,35,0.06)'; ctx.fill();

    // Loss curve
    ctx.strokeStyle = COLORS.accent2; ctx.lineWidth = 2.5;
    ctx.beginPath();
    ctx.moveTo(tx(0), ty(lossHistory[0]));
    for (let k = 1; k <= revealedSteps; k++) ctx.lineTo(tx(k), ty(lossHistory[k]));
    ctx.stroke();

    // Current point dot
    const cx2 = tx(revealedSteps), cy2 = ty(lossHistory[revealedSteps]);
    ctx.fillStyle = COLORS.accent; ctx.shadowColor = COLORS.accent; ctx.shadowBlur = 12;
    ctx.beginPath(); ctx.arc(cx2, cy2, 6, 0, Math.PI*2); ctx.fill(); ctx.shadowBlur = 0;

    // Annotation: "fast drop" and "converging"
    if (revealedSteps >= 25) {
      ctx.fillStyle = 'rgba(107,203,119,0.7)'; ctx.font = '10px JetBrains Mono';
      ctx.fillText('fast initial drop', tx(4), ty(3.5));
    }
    if (revealedSteps >= 80) {
      ctx.fillStyle = 'rgba(78,205,196,0.7)'; ctx.font = '10px JetBrains Mono';
      ctx.fillText('converging →', tx(72), ty(0.55));
    }

    const curLoss = lossHistory[revealedSteps];
    stat.textContent    = `L = ${curLoss.toFixed(3)}`;
    readout.textContent = `step ${revealedSteps} / ${TOTAL_STEPS}`;
  }

  function step() {
    if (revealedSteps < TOTAL_STEPS) { revealedSteps++; draw(); }
    if (revealedSteps >= TOTAL_STEPS || !running) { running = false; btn.textContent = '▶ Animate training'; return; }
    animId = setTimeout(step, 55);
  }

  btn.addEventListener('click', () => {
    if (running) { running = false; clearTimeout(animId); btn.textContent = '▶ Animate training'; }
    else { running = true; btn.textContent = '⏸ Pause'; step(); }
  });
  btnR.addEventListener('click', () => {
    running = false; clearTimeout(animId); btn.textContent = '▶ Animate training';
    generateHistory(); revealedSteps = 0; draw();
  });

  window.addEventListener('resize', draw);
  draw();
})();

// ─────────────────────────────────────────────────────────────────
// SCROLL FADE-IN
// ─────────────────────────────────────────────────────────────────
const observer=new IntersectionObserver(entries=>{
  entries.forEach(e=>{ if(e.isIntersecting) e.target.classList.add('visible'); });
},{threshold:0.12});
document.querySelectorAll('.fade-in').forEach(el=>observer.observe(el));
</script>
</body>
